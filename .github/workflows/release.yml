name: release

on:
  # Branch pushes are deliberately included: a tag-only trigger still reports a run on them,
  # which then lands as a zero-job failure. The jobs below gate themselves on tag refs, and
  # the placeholder job covers the rest.
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; a job that needs more declares it itself.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1

# No caches in this workflow on purpose: a poisoned cache on a tag build would ship to users.
jobs:
  # Covers every push that is not a tag, so a branch push ends green instead of as a run
  # with nothing to do.
  skipped:
    name: not a tag push
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # placeholder only, does nothing
    steps:
      - run: echo "branch pushes do not release; tag pushes run the real jobs"

  build:
    name: ${{ matrix.target }}
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read # check out the tree
      id-token: write # sign artefacts through Sigstore
      attestations: write # publish the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: Sonora-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: Sonora-Setup-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      # rust-toolchain.toml names the toolchain and its components; rustup installs what it asks.
      - name: toolchain
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          rustup show
          rustup target add "$TARGET"

      - name: build
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --release --locked --package sonora --target "$TARGET"

      - name: stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$TARGET"
              ;;

            Windows)
              cp \
                "target/$TARGET/release/sonora.exe" \
                "dist/sonora-$VERSION-$TARGET.exe"
              ;;

            *)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$VERSION-$TARGET"
              ;;
          esac

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "${{ runner.os == 'macOS' && format('darwin-{0}', matrix.target) || format('release-{0}', matrix.target) }}"
          path: dist/*
          if-no-files-found: error

  bundle:
    name: macos app bundle
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read # check out the tree
      id-token: write # sign artefacts through Sigstore
      attestations: write # publish the attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;

            *)
              version="${GITHUB_SHA:0:7}"
              number="0.0.0"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: darwin-*
          path: darwin
          merge-multiple: true

      - name: assemble the bundle
        shell: bash
        env:
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          set -euo pipefail

          mkdir -p \
            Sonora.app/Contents/MacOS \
            Sonora.app/Contents/Resources

          lipo -create \
            -output Sonora.app/Contents/MacOS/sonora \
            darwin/sonora-aarch64-apple-darwin \
            darwin/sonora-x86_64-apple-darwin
          chmod +x Sonora.app/Contents/MacOS/sonora
          lipo -info Sonora.app/Contents/MacOS/sonora

          cp \
            assets/macos/sonora.icns \
            Sonora.app/Contents/Resources/

          cp \
            COPYING \
            Sonora.app/Contents/Resources/LICENSE

          cp \
            THIRD-PARTY.md \
            Sonora.app/Contents/Resources/

          cp \
            assets/fonts/LICENSE.txt \
            Sonora.app/Contents/Resources/LICENSE.Inter

          mkdir -p Sonora.app/Contents/Resources/icons
          cp assets/icons/LICENSE Sonora.app/Contents/Resources/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "Sonora.app/Contents/Resources/icons/LICENSE.$pack"
          done

          sed \
            "s/@VERSION@/$NUMBER/g" \
            assets/macos/Info.plist \
            > Sonora.app/Contents/Info.plist

          plutil -lint Sonora.app/Contents/Info.plist

      - name: sign the bundle
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign - \
            Sonora.app

          codesign \
            --verify \
            --strict \
            --verbose=2 \
            Sonora.app

      - name: create the disk image
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R Sonora.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create \
            -volname Sonora \
            -srcfolder staging \
            -size "$((megabytes + 128))m" \
            -ov \
            -format UDZO \
            "dist/sonora-$VERSION-macos.dmg"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  appimage:
    name: "AppImage (${{ matrix.variant.arch }})"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # check out the tree
      id-token: write # sign artefacts through Sigstore
      attestations: write # publish the attestation

    env:
      # The runner images carry no libfuse2, so every AppImage tool has to unpack itself.
      APPIMAGE_EXTRACT_AND_RUN: 1
      ARCH: ${{ matrix.variant.arch }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;

            *)
              version="${GITHUB_SHA:0:7}"
              number=""
              ;;
          esac

          # Only a stable tag embeds where to update from. GitHub's latest release never points
          # at a prerelease, so a beta would be offered an older stable build, and an untagged
          # build would be offered a release it was never cut from.
          update=""
          case "$number" in
            "" | *-*) ;;
            *) update="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|sonora-*-$ARCH.AppImage.zsync" ;;
          esac

          {
            echo "version=$version"
            echo "number=$number"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ matrix.variant.target }}
          path: staged

      # The libraries the executable links, so linuxdeploy can resolve and copy them. Its own
      # excludelist decides which of them stay behind and come from the host instead.
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf file desktop-file-utils \
            libasound2 libfontconfig1 libfreetype6 libsqlite3-0 \
            libx11-6 libxcb1 libxcursor1 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libvulkan1 libdbus-1-3

      - name: fetch the AppImage tools
        run: |
          set -euo pipefail
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-$ARCH.AppImage"
          base=https://github.com/AppImage/appimagetool/releases/download/continuous
          curl -fsSL -o appimagetool "$base/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy appimagetool

      - name: assemble the AppDir
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
          UPDATE: ${{ steps.meta.outputs.update }}
          TARGET: ${{ matrix.variant.target }}
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin
          cp "staged/sonora-$VERSION-$TARGET" AppDir/usr/bin/sonora
          chmod +x AppDir/usr/bin/sonora

          # Every asset is compiled into the executable, so the AppDir carries the desktop entry
          # and the icons for the host's launcher and nothing else.
          mkdir -p AppDir/usr/share/icons
          cp -R assets/linux/icons/hicolor AppDir/usr/share/icons/

          # The keys AppImage managers identify and version the app by go into a copy, so the
          # entry the Flatpak and the distribution packages install stays as it is.
          homepage="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          mkdir -p desktop
          cp assets/linux/sonora.desktop desktop/sonora.desktop
          {
            echo "X-AppImage-Name=Sonora"
            echo "X-AppImage-Arch=$ARCH"
            echo "X-AppImage-Homepage=$homepage"
            if [ -n "$NUMBER" ]; then echo "X-AppImage-Version=$NUMBER"; fi
            if [ -n "$UPDATE" ]; then echo "X-AppImage-UpdateURL=$homepage"; fi
          } >> desktop/sonora.desktop
          desktop-file-validate desktop/sonora.desktop

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/sonora \
            --desktop-file desktop/sonora.desktop \
            --icon-file assets/linux/sonora.svg

          # The Vulkan loader has to be the host's: it is what finds the host's ICD, and a loader
          # this old paired with a current driver is how an AppImage stops starting.
          rm -f AppDir/usr/lib/libvulkan.so.1*

          mkdir -p AppDir/usr/share/doc/sonora/icons
          cp COPYING AppDir/usr/share/doc/sonora/LICENSE
          cp THIRD-PARTY.md AppDir/usr/share/doc/sonora/
          cp assets/fonts/LICENSE.txt AppDir/usr/share/doc/sonora/LICENSE.Inter
          cp assets/icons/LICENSE AppDir/usr/share/doc/sonora/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "AppDir/usr/share/doc/sonora/icons/LICENSE.$pack"
          done

      - name: build the AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          UPDATE: ${{ steps.meta.outputs.update }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="sonora-$VERSION-$ARCH.AppImage"

          # Given update information, appimagetool embeds it and writes the .zsync that
          # AppImageUpdate diffs against beside the image, with a zsyncmake of its own.
          # It also copies a VERSION it finds in its environment into X-AppImage-Version,
          # which would put the tag's v prefix over the bare number the desktop file carries.
          flags=()
          if [ -n "$UPDATE" ]; then flags=(--updateinformation "$UPDATE"); fi
          env -u VERSION ./appimagetool "${flags[@]}" AppDir "dist/$image"
          if [ -f "$image.zsync" ]; then mv "$image.zsync" dist/; fi

      - name: inspect the AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
          UPDATE: ${{ steps.meta.outputs.update }}
        run: |
          set -euo pipefail
          cd dist
          image="sonora-$VERSION-$ARCH.AppImage"
          "./$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/sonora
          test -f squashfs-root/sonora.desktop
          grep -qx "X-AppImage-Arch=$ARCH" squashfs-root/sonora.desktop
          if [ -n "$NUMBER" ]; then
            grep -qx "X-AppImage-Version=$NUMBER" squashfs-root/sonora.desktop
          fi
          if [ -n "$UPDATE" ]; then
            test -f "$image.zsync"
            # The runtime answers nothing to this flag once it is told to extract and run.
            test "$(env -u APPIMAGE_EXTRACT_AND_RUN "./$image" --appimage-updateinformation)" = "$UPDATE"
          else
            test ! -e "$image.zsync"
          fi
          test -f squashfs-root/usr/share/doc/sonora/THIRD-PARTY.md
          test ! -e squashfs-root/usr/lib/libvulkan.so.1
          ldd squashfs-root/usr/bin/sonora
          rm -rf squashfs-root

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-appimage-${{ matrix.variant.arch }}
          path: dist/*
          if-no-files-found: error

  # Build flatpak, see: https://github.com/flatpak/flatpak-github-actions
  flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    # The bundle builds on every tag and rides the release like every other artefact; only
    # the repository publishing leg further down keeps the FLATPAK_REPO gate.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # check out the tree

    container:
      # Use an image generated by Flathub to avoid re-installing the SDKs for every build,
      # see: https://github.com/flathub-infra/actions-images
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install flatpak-cargo-generator
        run: |
          python3 -m pip install --break-system-packages flatpak-cargo-generator

      - name: Generate Cargo Sources
        run: |
          chmod +x ./flatpak/generate-sources.sh
          ./flatpak/generate-sources.sh

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@10a3c29f0162516f0f68006be14c92f34bd4fa6c # v6.5
        with:
          manifest-path: flatpak/flatpak-builder.yaml
          bundle: sonora-${{ steps.meta.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          upload-artifact: true
          artifact-name: release-flatpak-${{ matrix.variant.arch }}

  flatpak-repo:
    name: publish the flatpak repository
    needs: flatpak
    if: vars.FLATPAK_REPO == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: flatpak-repo
    permissions:
      contents: write # force-push the flatpak-repo branch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: import the signing key
        id: key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          # A fixed home under the runner's temp dir, so no GITHUB_ENV write is needed. The
          # runner context only exists at step level, so this cannot sit on the job.
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "$KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: fetch the published repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY" site -- --depth 1 --branch flatpak-repo \
            || mkdir site
          rm -rf site/.git

      - name: publish the bundles
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          # Git cannot preserve OSTree's empty remote refs directory on the
          # flatpak-repo branch, but static-delta generation expects it.
          mkdir -p site/repo/tmp site/repo/refs/remotes
          test -f site/repo/config || ostree init --repo=site/repo --mode=archive
          for bundle in bundles/*.flatpak; do
            flatpak build-import-bundle \
              --gpg-sign="$FINGERPRINT" \
              --gpg-homedir="$GNUPGHOME" \
              site/repo "$bundle"
          done
          flatpak build-update-repo \
            --title=Sonora \
            --generate-static-deltas \
            --prune \
            --prune-depth=3 \
            --gpg-sign="$FINGERPRINT" \
            --gpg-homedir="$GNUPGHOME" \
            site/repo
          rm -rf site/repo/tmp
          cp -R flatpak/pages/. site/

      - name: export the bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: ./flatpak/export-bundles.sh site/repo "$VERSION" site

      - name: push the repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd site
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(flatpak): publish $VERSION"
          # The credential rides an http header, never the remote URL, so a remote listing
          # or error message cannot carry it.
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" \
            push --force "https://github.com/$GITHUB_REPOSITORY" HEAD:flatpak-repo

  draft:
    name: draft the release
    needs: [build, bundle, appimage, flatpak]
    # The flatpak leg is allowed to fail without taking the release down: only the binary
    # matrix, the macOS bundle and the AppImages gate the draft. A failed flatpak build just
    # leaves the .flatpak files out of the release.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' && needs.bundle.result == 'success' &&
      needs.appimage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the draft release and upload its assets
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: stage the licenses
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p licenses
          cp COPYING licenses/LICENSE
          cp THIRD-PARTY.md licenses/THIRD-PARTY.md
          cp assets/fonts/LICENSE.txt licenses/LICENSE.Inter
          mkdir -p licenses/icons
          cp assets/icons/LICENSE licenses/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "licenses/icons/LICENSE.$pack"
          done
          tar -czf "dist/sonora-$VERSION-licenses.tar.gz" -C licenses .

      - name: checksums
        run: cd dist && shasum -a 256 -- * > SHA256SUMS

      # The SLSA generator consumes one sha256sum-style line per released file, base64'd.
      - name: subjects
        id: hashes
        run: echo "hashes=$(cd dist && sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md
          printf '\n[Provenance](%s#provenance)\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> notes.md

      # The release is created as a draft with every asset already on it, then published.
      # Once published, immutable releases lock the tag and its assets for good.
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--draft --notes-file notes.md --title "$TAG")
          case "$TAG" in *-*) args+=(--prerelease);; esac
          gh release create "$TAG" "${args[@]}" dist/*

  # Provenance lands on the draft before it publishes: the SLSA generator runs in its own
  # isolated reusable workflow, which is what keeps a compromised build job from forging it.
  provenance:
    name: SLSA provenance
    # No explicit if: the draft job only succeeds on tag pushes, so needing it gates this
    # job on tags already. An if on a uses job proved unreliable in the skipped-vs-run check.
    needs: [draft]
    permissions:
      actions: read # read the workflow path for the provenance
      id-token: write # sign the provenance through Sigstore
      contents: write # attach the bundle to the draft release
    # The generator must be referenced by its release tag: it resolves the builder binary
    # from its own GitHub release by tag name, so a commit SHA breaks it. That makes the
    # tag pin deliberate rather than an unpinned-uses violation.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] the builder release is resolved by tag
    with:
      base64-subjects: ${{ needs.draft.outputs.hashes }}
      upload-assets: true
      # The release is a draft at this point; without this the generator opens a second,
      # published release on the same tag and races this workflow's own publish step.
      draft-release: true
      provenance-name: sonora-${{ github.ref_name }}.intoto.jsonl

  publish:
    name: publish the release
    # Same story: provenance only runs when the draft exists, so the needs chain is the gate.
    needs: [draft, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # publish the draft
    steps:
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

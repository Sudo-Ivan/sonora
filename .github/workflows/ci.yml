name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; a job that needs more declares it itself.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  # sccache lands through GITHUB_ENV right after each sccache-action step instead of here:
  # a workflow-level RUSTC_WRAPPER also applies to the steps that run before sccache is
  # installed, which is exactly what toolchain setup and cargo install are.

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read # check out the tree
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      # rust-toolchain.toml names the toolchain and its components; rustup installs what it asks.
      - name: toolchain
        run: rustup show

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ci-check
          cache-on-failure: true

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --workspace --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The check job only ever sees the Linux side of a cfg. These two lint the other two
  # platforms' code without paying for codegen, linking or an installer, which is the whole
  # cost of a release build. A tag still builds every target for real through release.yml.
  platforms:
    name: clippy on ${{ matrix.target }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the tree
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # rust-toolchain.toml names the toolchain and its components; rustup installs what it asks.
      - name: toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: lint-${{ matrix.target }}
          cache-on-failure: true

      - name: clippy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the tree
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: Sonora-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: Sonora-Setup-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      # rust-toolchain.toml names the toolchain and its components; rustup installs what it asks.
      - name: toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package sonora --target "$TARGET"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: stage the executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) cp "target/$TARGET/release/sonora.exe" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET.exe" ;;
            *)       cp "target/$TARGET/release/sonora" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET" ;;
          esac

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $env:SONORA_VERSION = "0.0.0"
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      # A convenience binary, not a release artefact: GitHub's artifact service times out often
      # enough that it must not be what turns a green build red.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Static analysis of the workflow files themselves.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tree
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # Supply-chain scan: local rules and OSV advisories.
  argus:
    name: argus
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tree
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The argus action is a two-line composite that installs from crates.io or an unpinned
      # git ref, so the tool lands here pinned by revision instead.
      - name: install argus
        run: >
          cargo install --locked
          --git https://github.com/Quad4-Software/argus
          --rev a8d04bace89a1efd7cd38981df286a10c1899d08

      - name: scan
        run: argus scan . --ci --fail-on high --format markdown --osv --vex openvex.json
